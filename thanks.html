<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | AIAHM</title>

<style>
  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  .thank-box {
    background: #fff;
    color: #111;
    padding: 50px 35px;
    border-radius: 18px;
    width: 90%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    animation: pop 0.6s ease;
  }

  .check {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #22c55e;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    margin: 0 auto 20px;
    animation: bounce 0.8s ease;
  }

  h1 {
    margin-bottom: 10px;
  }

  p {
    font-size: 15px;
    color: #444;
    margin-bottom: 25px;
  }

  .btn {
    display: inline-block;
    background: #fbbf24;
    color: #ffffff;
    padding: 12px 22px;
    border-radius: 8px;
    font-weight: bold;
    text-decoration: none;
    transition: 0.3s ease;
  }

  .btn:hover {
    transform: scale(1.05);
  }

  @keyframes pop {
    from {transform: scale(0.85); opacity: 0;}
    to {transform: scale(1); opacity: 1;}
  }

  @keyframes bounce {
    0% {transform: scale(0.3);}
    60% {transform: scale(1.2);}
    100% {transform: scale(1);}
  }


  
</style>
</head>

<body>
  <div class="thank-box">
    <div class="check">✓</div>
    <h1>Enquiry Sent!</h1>
    <p>Thank you for contacting AIAHM.<br>Our admissions team will reach you shortly.</p> 
    <a href="/" class="btn">Back to Home</a>
  </div>
</body>
</html>
